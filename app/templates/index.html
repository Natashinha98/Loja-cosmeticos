<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Loja de Cosméticos</title>
    <link rel="stylesheet" href="/static/estilo.css">
</head>
<body>
    <header>
        <h1>Loja de Cosméticos</h1>
        <p>Projeto simples com FastAPI + PostgreSQL + MongoDB + Redis</p>
    </header>

    <main>
        <section class="caixa">
            <h2>Cadastrar cliente</h2>
            <input id="cliente_nome" placeholder="Nome">
            <input id="cliente_email" placeholder="Email">
            <input id="cliente_telefone" placeholder="Telefone">
            <button onclick="cadastrarCliente()">Cadastrar cliente</button>
        </section>

        <section class="caixa">
            <h2>Cadastrar produto</h2>
            <input id="produto_nome" placeholder="Nome do produto">
            <input id="produto_categoria" placeholder="Categoria">
            <input id="produto_preco" placeholder="Preço" type="number" step="0.01">
            <input id="produto_estoque" placeholder="Estoque" type="number">
            <input id="produto_descricao" placeholder="Descrição">
            <button onclick="cadastrarProduto()">Cadastrar produto</button>
        </section>

        <section class="caixa">
            <h2>Criar pedido</h2>
            <input id="pedido_cliente" placeholder="ID do cliente" type="number">
            <select id="pedido_produto"></select>
            <input id="pedido_quantidade" placeholder="Quantidade" type="number" value="1">
            <button onclick="criarPedido()">Criar pedido</button>
        </section>

        <section class="caixa">
            <h2>Clientes</h2>
            <button onclick="carregarTudo()">Atualizar listas</button>
            <div id="lista_clientes"></div>
        </section>

        <section class="caixa">
            <h2>Produtos</h2>
            <div id="lista_produtos"></div>
        </section>

        <section class="caixa">
            <h2>Pedidos</h2>
            <div id="lista_pedidos"></div>
        </section>
    </main>

    <script src="/static/script.js"></script>
</body>
</html>
