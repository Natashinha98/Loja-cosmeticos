services:
  loja_backend:
    build: .
    container_name: loja_backend
    ports:
      - "8000:8000"
    volumes:
      - .:/codigo
    depends_on:
      banco_postgres:
        condition: service_healthy
      banco_mongo:
        condition: service_healthy
      banco_redis:
        condition: service_healthy
    environment:
      POSTGRES_HOST: banco_postgres
      POSTGRES_DB: loja_cosmeticos
      POSTGRES_USER: aluna
      POSTGRES_PASSWORD: senha123
      MONGO_URL: mongodb://banco_mongo:27017
      REDIS_HOST: banco_redis
    command: uvicorn app.principal:app --host 0.0.0.0 --port 8000 --reload
    restart: on-failure

  banco_postgres:
    image: postgres:16
    container_name: banco_postgres_loja
    restart: always
    environment:
      POSTGRES_DB: loja_cosmeticos
      POSTGRES_USER: aluna
      POSTGRES_PASSWORD: senha123
    ports:
      - "5432:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aluna -d loja_cosmeticos"]
      interval: 5s
      timeout: 5s
      retries: 10

  banco_mongo:
    image: mongo:7
    container_name: banco_mongo_loja
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - dados_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  banco_redis:
    image: redis:7
    container_name: banco_redis_loja
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - dados_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dados_postgres:
  dados_mongo:
  dados_redis:
